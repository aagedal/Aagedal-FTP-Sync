name: AagedalFTPSync
options:
  bundleIdPrefix: no.aagedal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 2.0.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
targets:
  AagedalFTPSync:
    type: application
    platform: macOS
    sources:
      - path: AagedalFTPSync
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.aagedal.AagedalFTPSync
        PRODUCT_MODULE_NAME: AagedalFTPSync
        INFOPLIST_FILE: AagedalFTPSync/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AagedalFTPSync/Resources/AagedalFTPSync.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
  AagedalFTPSyncTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AagedalFTPSyncTests
    dependencies:
      - target: AagedalFTPSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.aagedal.AagedalFTPSyncTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AagedalFTPSync:
    build:
      targets:
        AagedalFTPSync: all
        AagedalFTPSyncTests: [test]
    test:
      targets:
        - AagedalFTPSyncTests
