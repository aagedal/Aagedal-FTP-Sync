name: AagedalFTPSync
options:
  bundleIdPrefix: no.aagedal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 26
    MARKETING_VERSION: 2.6.0
    DEVELOPMENT_TEAM: 3R5QGG9DW6
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  Citadel:
    path: Vendor/Citadel
  SwiftMediaMetadata:
    url: https://github.com/aagedal/SwiftMediaMetadata.git
    exactVersion: 2.0.0
targets:
  AagedalFTPSync:
    type: application
    platform: macOS
    sources:
      - path: AagedalFTPSync
    dependencies:
      - package: Citadel
      - package: SwiftMediaMetadata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.aagedal.AagedalFTPSync
        PRODUCT_MODULE_NAME: AagedalFTPSync
        DEAD_CODE_STRIPPING: YES
        INFOPLIST_FILE: AagedalFTPSync/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AagedalFTPSync/Resources/AagedalFTPSync.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Aagedal FTP Sync
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_STRICT_CONCURRENCY: complete
  AagedalFTPSyncTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AagedalFTPSyncTests
    dependencies:
      - target: AagedalFTPSync
      - package: SwiftMediaMetadata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.aagedal.AagedalFTPSyncTests
        DEAD_CODE_STRIPPING: YES
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AagedalFTPSync:
    build:
      targets:
        AagedalFTPSync: all
        AagedalFTPSyncTests: [test]
    test:
      targets:
        - AagedalFTPSyncTests
