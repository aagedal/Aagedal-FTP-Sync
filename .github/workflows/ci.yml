name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: >-
          xcodebuild test
          -project AagedalFTPSync.xcodeproj
          -scheme AagedalFTPSync
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
