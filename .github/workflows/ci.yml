name: Release checks

on:
  pull_request:
  push:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install security-script prerequisites
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Verify dependency security baseline
        run: Scripts/check-security-baseline.sh

  vendored-ssh-signatures:
    name: Vendored SSH signature tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run signature regression tests
        run: swift test --package-path Vendor/swift-nio-ssh --filter NIOSSHSignatureTests

  application-tests:
    name: Application tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run application test suite
        run: >-
          xcodebuild test
          -project 'Aagedal FTP Sync.xcodeproj'
          -scheme AagedalFTPSync
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
