name: Scheduled integration checks

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

permissions:
  contents: read

concurrency:
  group: scheduled-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remote-transports:
    name: FTP, FTPS, and SFTP integration
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create isolated Python environment
        run: python3 -m venv "$RUNNER_TEMP/aftpsync-transport-venv"
      - name: Install pinned service dependencies
        run: >-
          "$RUNNER_TEMP/aftpsync-transport-venv/bin/python"
          -m pip install
          --requirement Scripts/delivery-latency-requirements.txt
      - name: Run loopback transport integration suite
        run: >-
          "$RUNNER_TEMP/aftpsync-transport-venv/bin/python"
          Scripts/run-remote-transport-tests.py

  signed-ui-smoke:
    name: Signed macOS UI smoke tests
    runs-on: [self-hosted, macOS, signed-ui-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify signing identity
        run: >-
          security find-identity -v -p codesigning
          | grep -q '"Apple Development:'
      - name: Run signed UI smoke suite
        run: >-
          xcodebuild test
          -project 'Aagedal FTP Sync.xcodeproj'
          -scheme AagedalFTPSyncUISmokeTests
          -destination 'platform=macOS'
